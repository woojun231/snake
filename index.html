<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐍 Ultra Snake — Character Edition</title>
  <meta name="description" content="5가지 고유 캐릭터로 즐기는 업그레이드 스네이크 게임"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050510; --panel: rgba(13,13,43,0.92);
      --neon-green: #39ff14; --neon-blue: #00eaff;
      --neon-purple: #bf00ff; --neon-yellow: #ffe600;
      --neon-red: #ff1744; --text: #e0e0ff; --text-dim: #7070a0;
      --cell: 27px;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; overflow: hidden; user-select: none;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(1px 1px at 15% 25%, rgba(0,234,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 75%, rgba(191,0,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 65% 15%, rgba(57,255,20,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 55%, rgba(255,0,170,.35) 0%, transparent 100%),
        radial-gradient(2px 2px at 50% 45%, rgba(0,234,255,.15) 0%, transparent 100%);
      background-size: 280px 280px;
      animation: starfield 22s linear infinite;
    }
    @keyframes starfield { to { transform: translateY(-280px); } }

    /* ─── CHARACTER SELECT ─────────────────────────────── */
    #charSelectScreen {
      position: fixed; inset: 0; z-index: 60;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 22px; padding: 24px;
      background: rgba(3,3,14,.97); backdrop-filter: blur(12px);
      transition: opacity .4s ease;
      overflow-y: auto;
    }
    #charSelectScreen.hidden { opacity: 0; pointer-events: none; }
    .cs-title {
      font-family: 'Orbitron', monospace; font-size: 2rem; font-weight: 900;
      background: linear-gradient(90deg,#39ff14,#00eaff,#bf00ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 12px rgba(0,234,255,.5)); letter-spacing: 4px;
    }
    .cs-sub { color: var(--text-dim); font-size: .85rem; letter-spacing: 2px; margin-top: -14px; }
    .char-cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .char-card {
      width: 158px; background: rgba(10,10,30,.9);
      border: 2px solid rgba(255,255,255,.1); border-radius: 18px;
      padding: 18px 12px 14px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      transition: transform .25s, box-shadow .25s, border-color .25s;
      position: relative; overflow: hidden;
    }
    .char-card:hover { transform: translateY(-7px); }
    .char-card.selected { transform: translateY(-10px) scale(1.05); }
    .char-card.selected { animation: cardGlow 2s ease infinite; }
    @keyframes cardGlow {
      0%,100% { box-shadow: 0 0 18px var(--cc,#00eaff), 0 8px 30px rgba(0,0,0,.4); }
      50% { box-shadow: 0 0 40px var(--cc,#00eaff), 0 8px 50px rgba(0,0,0,.5); }
    }
    .card-bg-glow {
      position: absolute; inset: 0; border-radius: 16px; opacity: .08;
      background: radial-gradient(circle at 50% 30%, var(--cc,#00eaff), transparent 65%);
      pointer-events: none;
    }
    .card-emoji { font-size: 3rem; line-height: 1; filter: drop-shadow(0 0 14px var(--cc,#fff)); }
    .card-name {
      font-family: 'Orbitron', monospace; font-size: .62rem;
      font-weight: 900; letter-spacing: 1.5px; text-align: center;
    }
    .card-sub { font-size: .7rem; color: var(--text-dim); text-align: center; }
    .card-div { width: 100%; height: 1px; background: rgba(255,255,255,.08); }
    .card-passive, .card-ult {
      font-size: .67rem; line-height: 1.45; color: var(--text-dim); text-align: center;
    }
    .card-passive strong, .card-ult strong {
      display: block; font-size: .58rem; letter-spacing: 1.5px;
      color: rgba(255,255,255,.4); margin-bottom: 2px;
    }
    .cs-play-btn {
      padding: 14px 70px;
      font-family: 'Orbitron', monospace; font-size: 1rem; font-weight: 900;
      letter-spacing: 3px; border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, #39ff14, #00eaff); color: #000;
      box-shadow: 0 0 28px rgba(57,255,20,.55);
      transition: transform .15s, box-shadow .2s;
    }
    .cs-play-btn:hover { transform: scale(1.06); box-shadow: 0 0 50px rgba(57,255,20,.8); }
    .cs-play-btn:active { transform: scale(.97); }

    /* ─── GAME WRAPPER ────────────────────────────────── */
    .wrapper {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 10px; padding: 14px;
    }
    .header h1 {
      font-family: 'Orbitron', monospace; font-size: 1.85rem; font-weight: 900;
      background: linear-gradient(90deg,#39ff14,#00eaff,#bf00ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 10px rgba(57,255,20,.45)); letter-spacing: 4px;
      text-align: center;
    }

    /* ─── STATS BAR ─────────────────────────────────── */
    .stats-bar {
      display: flex; gap: 16px; align-items: center;
      background: var(--panel); border: 1px solid rgba(0,234,255,.2);
      border-radius: 12px; padding: 8px 18px;
      backdrop-filter: blur(12px); flex-wrap: wrap; justify-content: center;
    }
    .stat { display: flex; flex-direction: column; align-items: center; }
    .stat-label { font-size: .58rem; letter-spacing: 2px; color: var(--text-dim); }
    .stat-value {
      font-family: 'Orbitron', monospace; font-size: 1.15rem; font-weight: 700;
      color: var(--neon-blue); text-shadow: 0 0 8px var(--neon-blue);
      transition: transform .1s, color .2s;
    }
    .stat-value.bump { transform: scale(1.35); color: var(--neon-yellow); }
    .sdiv { width: 1px; height: 34px; background: rgba(0,234,255,.12); }
    .char-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,.3); border-radius: 8px;
      padding: 4px 10px; border: 1px solid rgba(255,255,255,.09);
    }
    .char-badge-name {
      font-family: 'Orbitron', monospace; font-size: .58rem;
      font-weight: 900; letter-spacing: 1px;
    }

    /* ─── ULT BAR ───────────────────────────────────── */
    .ult-row {
      width: 100%; max-width: 555px;
      display: flex; align-items: center; gap: 9px;
    }
    .ult-label { font-family: 'Orbitron', monospace; font-size: .58rem; letter-spacing: 1px; color: var(--text-dim); white-space: nowrap; }
    .ult-key-box {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; flex-shrink: 0;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18);
      border-radius: 5px; font-family: 'Orbitron', monospace;
      font-size: .68rem; color: var(--text); transition: all .2s;
    }
    .ult-key-box.ready {
      background: rgba(57,255,20,.15); border-color: var(--neon-green);
      color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green);
      animation: keyPulse .7s ease infinite alternate;
    }
    @keyframes keyPulse { from{opacity:.7} to{opacity:1} }
    .ult-bar-bg {
      flex: 1; height: 9px; background: rgba(255,255,255,.06);
      border-radius: 99px; overflow: hidden;
    }
    .ult-bar-fill {
      height: 100%; border-radius: 99px; transition: width .3s ease;
    }
    .ult-bar-fill.ready { animation: ultBlink .5s ease infinite alternate; }
    @keyframes ultBlink { from{filter:brightness(1)} to{filter:brightness(1.5)} }
    .ult-txt {
      font-family: 'Orbitron', monospace; font-size: .63rem;
      white-space: nowrap; min-width: 48px; text-align: right;
    }

    /* ─── LEVEL BAR ─────────────────────────────────── */
    .lv-row { width: 100%; max-width: 555px; display: flex; flex-direction: column; gap: 3px; }
    .lv-info { display: flex; justify-content: space-between; font-size: .7rem; color: var(--text-dim); letter-spacing: 1px; }
    .lv-bg { height: 5px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; }
    .lv-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #bf00ff, #00eaff);
      box-shadow: 0 0 6px #00eaff; transition: width .4s;
    }

    /* ─── GAME AREA ─────────────────────────────────── */
    .game-area { display: flex; gap: 14px; align-items: flex-start; }
    .canvas-wrap { position: relative; }
    #gameCanvas {
      display: block; border-radius: 12px;
      border: 2px solid rgba(0,234,255,.22);
      box-shadow: 0 0 28px rgba(0,234,255,.09), 0 0 55px rgba(191,0,255,.07);
      background: #040416; cursor: none;
    }

    /* ─── OVERLAY ────────────────────────────────────── */
    .canvas-overlay {
      position: absolute; inset: 0; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(4,4,22,.9); backdrop-filter: blur(5px);
      gap: 7px; transition: opacity .3s;
    }
    .canvas-overlay.hidden { opacity: 0; pointer-events: none; }
    .canvas-overlay h2 {
      font-family: 'Orbitron', monospace; font-size: 1.7rem; font-weight: 900;
    }
    .canvas-overlay p { color: var(--text-dim); font-size: .88rem; letter-spacing: 1px; text-align: center; padding: 0 20px; }
    .ov-score {
      font-family: 'Orbitron', monospace; font-size: 2.6rem; font-weight: 900;
      color: var(--neon-green); text-shadow: 0 0 28px var(--neon-green);
    }
    .new-rec {
      font-family: 'Orbitron', monospace; font-size: .82rem;
      color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow);
      letter-spacing: 3px; animation: recPulse 1s ease infinite alternate;
    }
    @keyframes recPulse { from{opacity:.6} to{opacity:1} }
    .btn {
      margin-top: 10px; padding: 11px 30px;
      font-family: 'Orbitron', monospace; font-size: .82rem; font-weight: 700;
      letter-spacing: 2px; border: none; border-radius: 8px; cursor: pointer;
      background: linear-gradient(135deg,#39ff14,#00eaff); color: #000;
      box-shadow: 0 0 18px rgba(57,255,20,.4);
      transition: transform .1s, box-shadow .2s; pointer-events: auto;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 32px rgba(57,255,20,.7); }
    .btn:active { transform: scale(.97); }
    .btn-ghost {
      padding: 7px 22px;
      font-family: 'Orbitron', monospace; font-size: .68rem; font-weight: 700;
      letter-spacing: 2px; border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px; cursor: pointer;
      background: rgba(255,255,255,.04); color: var(--text-dim);
      transition: all .2s; pointer-events: auto;
    }
    .btn-ghost:hover { background: rgba(255,255,255,.1); color: var(--text); }

    /* ─── SIDE PANEL ─────────────────────────────────── */
    .side-panel { display: flex; flex-direction: column; gap: 10px; width: 172px; }
    .panel-box {
      background: var(--panel); border: 1px solid rgba(0,234,255,.13);
      border-radius: 12px; padding: 11px 13px; backdrop-filter: blur(12px);
    }
    .panel-title {
      font-family: 'Orbitron', monospace; font-size: .58rem;
      letter-spacing: 2px; color: var(--text-dim); margin-bottom: 9px;
    }

    /* passive meter */
    .pm-label { display:flex; justify-content:space-between; font-size:.72rem; color:var(--text-dim); margin-bottom:3px; }
    .pm-bg { height:5px; background:rgba(255,255,255,.06); border-radius:99px; overflow:hidden; margin-bottom:6px; }
    .pm-fill { height:100%; border-radius:99px; transition:width .3s; }

    /* effects */
    .effects-list { display: flex; flex-direction: column; gap: 6px; }
    .eff-item { display:flex; align-items:center; gap:6px; font-size:.8rem; animation:fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateX(-7px)} to{opacity:1;transform:none} }
    .eff-icon { font-size:.95rem; }
    .eff-bar-bg { flex:1; height:4px; background:rgba(255,255,255,.09); border-radius:99px; overflow:hidden; }
    .eff-bar { height:100%; border-radius:99px; transition:width .1s; }
    .eff-empty { color:var(--text-dim); font-size:.76rem; text-align:center; }

    /* legend */
    .legend { display:flex; flex-direction:column; gap:5px; }
    .leg-item { display:flex; align-items:center; gap:5px; font-size:.76rem; color:var(--text-dim); }
    .leg-e { font-size:.9rem; width:18px; text-align:center; }
    .leg-n { color:var(--text); font-weight:600; }
    .leg-d { font-size:.64rem; }

    /* controls */
    .controls {
      background: var(--panel); border: 1px solid rgba(0,234,255,.13);
      border-radius: 12px; padding: 11px 13px; text-align: center;
      font-size: .7rem; color: var(--text-dim); line-height: 1.95; letter-spacing: 1px;
    }
    .key {
      display: inline-block; background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14); border-radius: 4px;
      padding: 1px 5px; font-family: 'Orbitron', monospace;
      font-size: .6rem; color: var(--neon-blue);
    }

    /* ─── POPUPS ─────────────────────────────────────── */
    .combo-pop {
      position:fixed; pointer-events:none;
      font-family:'Orbitron',monospace; font-weight:900; font-size:1.5rem;
      color:var(--neon-yellow); text-shadow:0 0 18px var(--neon-yellow);
      animation:comboPop 1s ease forwards; z-index:200;
    }
    @keyframes comboPop {
      0%{opacity:1;transform:scale(.5) translateY(0)}
      50%{opacity:1;transform:scale(1.2) translateY(-18px)}
      100%{opacity:0;transform:scale(1) translateY(-45px)}
    }
    .float-score {
      position:fixed; pointer-events:none;
      font-family:'Orbitron',monospace; font-weight:700; font-size:.95rem;
      text-shadow:0 0 10px currentColor;
      animation:floatUp .95s ease forwards; z-index:200;
    }
    @keyframes floatUp { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-52px)} }
    .ult-announce {
      position:fixed; pointer-events:none; z-index:210;
      font-family:'Orbitron',monospace; font-weight:900; font-size:1.3rem; letter-spacing:4px;
      top:50%; left:50%; text-align:center;
      animation:ultAnn 1.5s ease forwards;
    }
    @keyframes ultAnn {
      0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
      18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
      70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(.92)}
    }

    /* ─── D-PAD ──────────────────────────────────────── */
    .dpad { display:none; gap:6px; flex-direction:column; align-items:center; margin-top:4px; }
    .dpad-row { display:flex; gap:6px; }
    .dpad-btn {
      width:46px; height:46px; background:var(--panel);
      border:1px solid rgba(0,234,255,.22); border-radius:10px;
      font-size:1.2rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .15s, transform .1s; color:var(--neon-blue);
    }
    .dpad-btn:active { background:rgba(0,234,255,.14); transform:scale(.92); }

    @media(max-width:700px) {
      :root{--cell:16px;}
      .header h1{font-size:1.3rem;}
      .game-area{flex-direction:column;align-items:center;}
      .side-panel{flex-direction:row;width:100%;flex-wrap:wrap;}
      .panel-box{flex:1;min-width:140px;}
      .dpad{display:flex;}
      .char-card{width:130px;}
    }
  </style>
</head>
<body>

<!-- ═══════ CHARACTER SELECT SCREEN ═══════════════════════════ -->
<div id="charSelectScreen">
  <div class="cs-title">🐍 ULTRA SNAKE</div>
  <div class="cs-sub">CHOOSE YOUR SERPENT</div>
  <div class="char-cards" id="charCards"></div>
  <button class="cs-play-btn" onclick="confirmCharSelect()">▶ PLAY</button>
</div>

<!-- ═══════ GAME SCREEN ════════════════════════════════════════ -->
<div class="wrapper" id="gameWrapper">
  <div class="header"><h1>🐍 ULTRA SNAKE</h1></div>

  <div class="stats-bar">
    <div class="char-badge">
      <span id="badgeEmoji" style="font-size:1.2rem">⚡</span>
      <span class="char-badge-name" id="badgeName">BLAZE</span>
    </div>
    <div class="sdiv"></div>
    <div class="stat"><span class="stat-label">SCORE</span><span class="stat-value" id="scoreDisp">0</span></div>
    <div class="sdiv"></div>
    <div class="stat"><span class="stat-label">BEST</span><span class="stat-value" id="bestDisp">0</span></div>
    <div class="sdiv"></div>
    <div class="stat"><span class="stat-label">LEVEL</span><span class="stat-value" id="lvlDisp">1</span></div>
    <div class="sdiv"></div>
    <div class="stat"><span class="stat-label">COMBO</span><span class="stat-value" id="comboDisp" style="color:var(--neon-yellow)">×1</span></div>
    <div class="sdiv"></div>
    <div class="stat"><span class="stat-label">LENGTH</span><span class="stat-value" id="lenDisp">3</span></div>
  </div>

  <div class="ult-row">
    <span class="ult-label">궁극기</span>
    <div class="ult-key-box" id="ultKey">Q</div>
    <div class="ult-bar-bg">
      <div class="ult-bar-fill" id="ultFill" style="width:0%"></div>
    </div>
    <span class="ult-txt" id="ultTxt">0/8</span>
  </div>

  <div class="lv-row">
    <div class="lv-info"><span>LEVEL <span id="lvNum">1</span></span><span id="xpTxt">0/10 XP</span></div>
    <div class="lv-bg"><div class="lv-fill" id="lvFill" style="width:0%"></div></div>
  </div>

  <div class="game-area">
    <div class="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
      <div class="canvas-overlay" id="overlay">
        <h2 id="ovTitle" style="color:var(--neon-green)">READY?</h2>
        <p id="ovMsg">캐릭터 특수 능력을 활용하라!</p>
        <div id="ovScore" class="ov-score" style="display:none"></div>
        <div id="ovRec" class="new-rec" style="display:none">🏆 신기록!</div>
        <button class="btn" onclick="startGame()">PLAY</button>
        <button class="btn-ghost" onclick="goCharSelect()">캐릭터 변경</button>
      </div>
    </div>

    <div class="side-panel">
      <div class="panel-box" id="abilBox">
        <div class="panel-title" id="abilTitle">⚡ 캐릭터 능력</div>
        <div id="abilContent" style="font-size:.73rem;color:var(--text-dim);line-height:1.55"></div>
      </div>
      <div class="panel-box">
        <div class="panel-title">✦ 활성 효과</div>
        <div class="effects-list" id="effList"><div class="eff-empty">효과 없음</div></div>
      </div>
      <div class="panel-box">
        <div class="panel-title">🗺 아이템</div>
        <div class="legend">
          <div class="leg-item"><span class="leg-e">🍎</span><div><span class="leg-n">사과</span> <span class="leg-d">기본 먹이</span></div></div>
          <div class="leg-item"><span class="leg-e">⚡</span><div><span class="leg-n">스피드</span> <span class="leg-d">속도↑</span></div></div>
          <div class="leg-item"><span class="leg-e">🛡️</span><div><span class="leg-n">쉴드</span> <span class="leg-d">벽 통과</span></div></div>
          <div class="leg-item"><span class="leg-e">✨</span><div><span class="leg-n">2배점</span> <span class="leg-d">점수 ×2</span></div></div>
          <div class="leg-item"><span class="leg-e">💎</span><div><span class="leg-n">다이아</span> <span class="leg-d">+50점</span></div></div>
          <div class="leg-item"><span class="leg-e">💣</span><div><span class="leg-n">폭탄</span> <span class="leg-d">꼬리 단축</span></div></div>
        </div>
      </div>
      <div class="controls">
        <span class="key">↑↓←→</span>/<span class="key">WASD</span> 이동<br>
        <span class="key">Q</span> 궁극기 발동<br>
        <span class="key">P</span> 일시정지 · <span class="key">R</span> 재시작
      </div>
    </div>
  </div>

  <div class="dpad">
    <div class="dpad-row"><div class="dpad-btn" ontouchstart="dpad('UP')">▲</div></div>
    <div class="dpad-row">
      <div class="dpad-btn" ontouchstart="dpad('LEFT')">◀</div>
      <div class="dpad-btn" ontouchstart="dpad('DOWN')">▼</div>
      <div class="dpad-btn" ontouchstart="dpad('RIGHT')">▶</div>
    </div>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════
//  CHARACTER DEFINITIONS
// ═══════════════════════════════════════════════════════════════
const CHARS = {
  blaze: {
    id:'blaze', emoji:'⚡', name:'BLAZE VIPER', sub:'속도의 악마',
    hc:'#ff9500', tc:'#ffe633', gc:'#ff6a00',
    cb:'rgba(255,149,0,.75)', cg:'rgba(255,149,0,.25)',
    grad:['#ff9500','#ffe633'],
    passive:'⚡ 패시브: 속도 2배 · 점수 2배 항상 적용',
    ult:'초음속 3초 + 주변 2칸 먹이·아이템 자동 흡수',

const XP_TBL = [10,15,20,26,33,42,52,64,77,92,108,126,146,168,192];

let snake, dir, nextDir, food, items, effects;

let loopT, itemT;
let particles = [];
let flashAmt  = 0, flashCol = 'rgba(57,255,20,';

// Iron Boa
let ironCount = 0, ironPassive = false, ironPassiveUntil = 0;

// Basilisk

//  CHARACTER SELECT UI

function buildCards() {
  const wrap = document.getElementById('charCards');
  wrap.innerHTML = '';
  CHAR_ORDER.forEach(id => {
    const c = CHARS[id];
    const div = document.createElement('div');
    div.className = 'char-card' + (id === selChar ? ' selected' : '');
    div.id = `cc-${id}`;
    div.style.setProperty('--cc', c.hc);
    div.style.borderColor = c.cb;
    div.style.boxShadow   = `0 0 ${id===selChar?'30px':'10px'} ${c.cg}`;
    div.onclick = () => pickChar(id);
    div.innerHTML = `
      <div class="card-bg-glow"></div>
      <div class="card-emoji" style="--cc:${c.hc}">${c.emoji}</div>
      <div class="card-name"  style="color:${c.hc}">${c.name}</div>
      <div class="card-sub">${c.sub}</div>
      <div class="card-div"></div>
      <div class="card-passive"><strong>PASSIVE</strong>${c.passive.replace(/^[^ ]+ /,'')}</div>
      <div class="card-div"></div>
      <div class="card-ult"><strong>Q 궁극기 (${c.ultCost}개)</strong>${c.ult}</div>`;
    wrap.appendChild(div);
  });
}

function pickChar(id) {
  selChar = id;
  CHAR_ORDER.forEach(cid => {
    const el = document.getElementById(`cc-${cid}`);
    const c  = CHARS[cid];
    el.classList.toggle('selected', cid === id);
    el.style.boxShadow = `0 0 ${cid===id?'30px':'10px'} ${c.cg}`;
  });
}

function confirmCharSelect() {
  document.getElementById('charSelectScreen').classList.add('hidden');
  applyCharUI();
  showReadyOverlay();
}

function goCharSelect() {
  running = false;
  clearTimeout(loopT); clearTimeout(itemT);
  buildCards();
  document.getElementById('charSelectScreen').classList.remove('hidden');
}

function applyCharUI() {

//  GAME START / RESET

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  snake   = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir     = {x:1,y:0};
  nextDir = {x:1,y:0};
  food    = spawnFood();
  items   = []; effects = {};
  score = 0; combo = 1; level = 1; xp = 0;
  particles = []; flashAmt = 0;

  // ult reset
  ultGauge = 0; ultActive = false; ultUntil = 0;
  // iron boa
  ironCount = 0; ironPassive = false; ironPassiveUntil = 0;
  // inferno
  fireTiles = []; fireTick = 0;
  // basilisk
  basiliskNextAuto = Date.now() + 10000;

  running = true; paused = false;
  updateHUD(); updateUltUI();
  clearTimeout(loopT); clearTimeout(itemT);
  scheduleItem();
  loop();
}

// ═══════════════════════════════════════════════════════════════
//  CHARACTER BEHAVIOUR
// ═══════════════════════════════════════════════════════════════
function modSpeed(base) {
  switch(selChar) {
    case 'blaze':   base *= (ultActive ? 0.28 : 0.5); break;
    case 'phantom': if (ultActive) base *= 0.82; break;
    case 'basilisk':
      if (combo >= 5) base *= 0.92;
      if (combo >= 9) base *= 0.88;
      break;
  }
  return Math.max(base, 33);
}

function modScore(pts) {
  // Blaze: always ×2
  if (selChar === 'blaze')    pts *= 2;
  // Basilisk: ×combo
  if (selChar === 'basilisk') pts *= combo;
  // Double item
  if (effects.double) pts *= 2;
  return Math.round(pts);
}

function wallCollide(head) {
  // Returns true = game over, also handles wrap
  const phantom    = selChar === 'phantom';
  const shieldOn   = !!effects.shield;
  const iboaUlt    = selChar === 'ironboa' && ultActive;

  if (phantom || shieldOn || iboaUlt) {
    head.x = ((head.x % GRID) + GRID) % GRID;
    head.y = ((head.y % GRID) + GRID) % GRID;
    return false;
  }
  return head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
}

function selfCollide(head) {
  if (effects.shield) return false;
  if (ultActive && selChar === 'phantom') return false;
  if (ultActive && selChar === 'ironboa') return false;
  if (ironPassive && selChar === 'ironboa') return false;
  return snake.some(s => s.x === head.x && s.y === head.y);
}

function onEat(isApple, head) {
  if (isApple) {
    chargeUlt(1);
    // Iron Boa passive
    if (selChar === 'ironboa') {
      ironCount++;
      if (ironCount >= 10) {
        ironCount = 0;
        ironPassive = true;
        ironPassiveUntil = Date.now() + 10000;
        flashAmt = 12; flashCol = 'rgba(79,195,247,';
        announce('🛡️ 거대화 발동!', CHARS.ironboa.hc);
      }
    }
  } else {
    chargeUlt(2);
  }
}

function chargeUlt(n) {
  if (ultActive) return;
  const c = CHARS[selChar];
  ultGauge = Math.min(ultGauge + n, c.ultCost);
  updateUltUI();
}

function charTick() {
  const now = Date.now();

  // Expire ult
  if (ultActive && CHARS[selChar].ultDur > 0 && now > ultUntil) {
    ultActive = false; updateUltUI();
  }
  // Expire iron passive
  if (selChar === 'ironboa' && ironPassive && now > ironPassiveUntil) {
    ironPassive = false;
  }

  // BLAZE: auto-attract food/items
  if (selChar === 'blaze' && ultActive) {
    const h = snake[0];
    if (Math.abs(food.x-h.x) <= 2 && Math.abs(food.y-h.y) <= 2) {
      food = { x:h.x, y:h.y };
    }
    for (const it of items) {
      if (Math.abs(it.x-h.x) <= 2 && Math.abs(it.y-h.y) <= 2) {
        it.x = h.x; it.y = h.y;
      }
    }
  }

  // INFERNO: fire trail
  if (selChar === 'inferno') {
    fireTick++;
    const interval = ultActive ? 1 : 2;
    if (fireTick % interval === 0) {
      const h = snake[0];
      fireTiles.push({ x:h.x, y:h.y, born:now, until:now+8000 });
      if (fireTiles.length > 80) fireTiles.shift();
    }
    fireTiles = fireTiles.filter(f => now < f.until);
    // Ult: absorb items within 3 cells
    if (ultActive) {
      const h = snake[0];
      for (let i = items.length-1; i >= 0; i--) {
        const it = items[i];
        if (Math.abs(it.x-h.x)+Math.abs(it.y-h.y) <= 3) {
          applyItem(it, h); items.splice(i,1);
        }
      }
    }
  }

  // BASILISK: auto combo every 10s
  if (selChar === 'basilisk' && now >= basiliskNextAuto) {
    combo = Math.min(combo+1, 12);
    basiliskNextAuto = now + 10000;
    announce(`💜 콤보 자동 +1!`, CHARS.basilisk.hc);
  }
}

function activateUlt() {
  const c = CHARS[selChar];
  if (ultGauge < c.ultCost || ultActive) return;
  ultGauge = 0;

  switch(selChar) {
    case 'blaze':
      ultActive = true; ultUntil = Date.now() + c.ultDur;
      flashAmt = 10; flashCol = 'rgba(255,149,0,';
      announce('⚡ 초음속 질주!', c.hc);
      break;
    case 'ironboa':
      ultActive = true; ultUntil = Date.now() + c.ultDur;
      flashAmt = 12; flashCol = 'rgba(79,195,247,';
      announce('🛡️ 철갑 요새!', c.hc);
      break;
    case 'phantom':
      ultActive = true; ultUntil = Date.now() + c.ultDur;
      flashAmt = 8;  flashCol = 'rgba(224,64,251,';
      announce('👻 유령 모드!', c.hc);
      break;
    case 'inferno':
      ultActive = true; ultUntil = Date.now() + c.ultDur;
      { const now = Date.now();
        for (let x=0;x<GRID;x++) for (let y=0;y<GRID;y++)
          if (Math.random()<.35)
            fireTiles.push({x,y,born:now,until:now+c.ultDur});
      }
      flashAmt = 14; flashCol = 'rgba(255,87,34,';
      announce('🔥 폭염 폭발!', c.hc);
      break;
    case 'basilisk':
      { const bonus = Math.floor(score * combo * 0.25);
        if (bonus > 0) { score += bonus; showFloatPt(bonus, snake[0], c.hc); if(score>best){best=score;localStorage.setItem('us_best',best);} }
        flashAmt = 10; flashCol = 'rgba(233,30,140,';
        announce(`💜 콤보 폭발! +${bonus}`, c.hc);
      }
      break;
  }
  updateUltUI();
}

function getDrawStyle() {
  const c = CHARS[selChar];
  let scale = 1.0, alpha = 1.0;
  if (selChar === 'ironboa' && (ironPassive || ultActive)) {
    scale = 1.35 + 0.1 * Math.sin(Date.now()/180); // pulsing between 1.35–1.45
  }
  if (selChar === 'phantom' && ultActive) alpha = 0.42;
  return { scale, alpha, hc: c.hc, tc: c.tc, gc: c.gc };
}

// ═══════════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════════
function getSpeed() {
  let base = 140 - (level-1)*5;
  base = Math.max(base, 70);
  if (effects.speed) base *= 0.55;
  if (effects.slow)  base *= 1.8;
  return modSpeed(base);
}

function loop() {
  if (!running || paused) return;
  update(); draw();
  loopT = setTimeout(loop, getSpeed());
}

// ═══════════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════════
function update() {
  dir = nextDir;
  const head = { x: snake[0].x+dir.x, y: snake[0].y+dir.y };

  if (wallCollide(head)) { endGame(); return; }
  if (selfCollide(head))  { endGame(); return; }

  snake.unshift(head);

  // Inferno: fire re-visit bonus (check BEFORE adding new tile in charTick)
  if (selChar === 'inferno') {
    const now = Date.now();
    const hit = fireTiles.find(f => f.x===head.x && f.y===head.y && (now-f.born) > 800);
    if (hit) { gainScore(5, head); spawnPfx(head.x, head.y, '#ff9800', 8); }
  }

  charTick();

  // Eat food?
  if (head.x === food.x && head.y === food.y) {
    gainScore(10, head);
    food = spawnFood();
    gainXP(1);
    spawnPfx(head.x, head.y, '#ff4444', 12);
    combo = Math.min(combo+1, selChar==='basilisk'?12:8);
    showCombo(head);
    onEat(true, head);
    playBeep('apple');
  } else {
    snake.pop();
  }

  // Eat items?
  for (let i=items.length-1; i>=0; i--) {
    const it=items[i];
    if (head.x===it.x && head.y===it.y) {
      applyItem(it, head); onEat(false, head); items.splice(i,1);
    }
  }

  // Expire board items (12s)
  const now = Date.now();
  items = items.filter(it => now - it.born < 12000);

  // Expire timed effects
  for (const k of Object.keys(effects))
    if (effects[k].until && now > effects[k].until) delete effects[k];

  updateHUD(); updateEffUI();
}

function applyItem(it, head) {
  const def = ITEMS[it.type];
  spawnPfx(head.x, head.y, def.gc, 16);
  playBeep(it.type);
  if (def.bonus > 0) gainScore(def.bonus, head);
  if (def.duration > 0) effects[it.type] = { until: Date.now()+def.duration };
  if (it.type === 'bomb') {
    snake = snake.slice(0, Math.max(3, snake.length - Math.floor(snake.length*.4)));
    flashAmt = 8; flashCol = 'rgba(255,106,0,'; combo = 1;
  } else {
    snake.push({...snake[snake.length-1]});
  }
  gainXP(2);
}

function gainScore(pts, cell) {
  pts = modScore(pts);
  score += pts;
  showFloatPt(pts, cell, CHARS[selChar].hc);
  if (score > best) { best = score; localStorage.setItem('us_best', best); }
}

function gainXP(n) {
  xp += n;
  const need = xpNeed(level);
  if (xp >= need) { xp -= need; level++; flashAmt = 6; flashCol = 'rgba(57,255,20,'; }
}

function endGame() {
  running = false;
  clearTimeout(loopT); clearTimeout(itemT);
  draw();
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  document.getElementById('ovTitle').textContent = '💀 GAME OVER';
  document.getElementById('ovTitle').style.color = 'var(--neon-red)';
  document.getElementById('ovMsg').textContent   = `레벨 ${level} · 최대 콤보 ×${combo}`;
  document.getElementById('ovScore').style.display = 'block';
  document.getElementById('ovScore').textContent = score;
  const isNew = score >= best && score > 0;
  document.getElementById('ovRec').style.display = isNew ? 'block' : 'none';
  document.querySelector('#overlay .btn').textContent = 'RETRY';
  updateHUD();
}

// ═══════════════════════════════════════════════════════════════
//  SPAWN
// ═══════════════════════════════════════════════════════════════
function spawnFood() { return randomCell(); }

function randomCell() {
  let pos, t=0;
  do {
    pos = { x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID) };
    t++;
  } while (t<200 && (
    snake.some(s=>s.x===pos.x&&s.y===pos.y) ||
    items.some(i=>i.x===pos.x&&i.y===pos.y) ||
    (food && pos.x===food.x && pos.y===food.y)
  ));
  return pos;
}

function wRand(pool) {
  const tot = pool.reduce((s,k)=>s+ITEMS[k].weight,0);
  let r = Math.random()*tot;
  for (const k of pool) { r-=ITEMS[k].weight; if(r<=0)return k; }
  return pool[pool.length-1];
}

function scheduleItem() {
  itemT = setTimeout(()=>{
    if(!running||paused)return;
    if(items.length<3){
      const type = wRand(Object.keys(ITEMS));
      items.push({...randomCell(), type, born:Date.now()});
    }
    scheduleItem();
  }, 5000+Math.random()*5000);
}

// ═══════════════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════════════
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Grid
  ctx.strokeStyle='rgba(0,234,255,.04)'; ctx.lineWidth=0.5;
  for(let x=0;x<=GRID;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,canvas.height);ctx.stroke();}
  for(let y=0;y<=GRID;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(canvas.width,y*CELL);ctx.stroke();}

  // Screen flash
  if(flashAmt>0){
    ctx.fillStyle=`${flashCol}${flashAmt/28})`;
    ctx.fillRect(0,0,canvas.width,canvas.height); flashAmt--;
  }

  // Fire tiles
  if(selChar==='inferno' && fireTiles.length){
    const now=Date.now();
    ctx.save();
    for(const f of fireTiles){
      const life=(f.until-now)/8000;
      const flicker=0.5+Math.random()*0.5;
      ctx.globalAlpha = Math.min(life*0.6, 0.48)*flicker;
      const hue=8+Math.random()*25;
      ctx.fillStyle=`hsl(${hue},100%,55%)`;
      ctx.shadowColor='#ff5722'; ctx.shadowBlur=10;
      const p=CELL*0.18;
      ctx.fillRect(f.x*CELL+p, f.y*CELL+p, CELL-p*2, CELL-p*2);
    }
    ctx.restore();
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life/p.maxL;
    ctx.shadowColor=p.col; ctx.shadowBlur=4;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.life/p.maxL),0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // Food
  const fp=0.84+0.16*Math.sin(Date.now()/200);
  ctx.font=`${Math.round(CELL*fp)}px serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='#ff3333'; ctx.shadowBlur=22*fp;
  ctx.fillText('🍎', food.x*CELL+CELL/2, food.y*CELL+CELL/2);
  ctx.shadowBlur=0;

  // Items
  const t=Date.now();
  for(const it of items){
    const age=t-it.born;
    const bob=Math.sin(t/280+it.x)*2;
    const blink=age>9000?(Math.floor(t/150)%2===0?1:.3):1;
    ctx.globalAlpha=blink;
    const def=ITEMS[it.type];
    ctx.shadowColor=def.gc; ctx.shadowBlur=18;
    ctx.font=`${CELL-2}px serif`;
    ctx.fillText(def.emoji, it.x*CELL+CELL/2, it.y*CELL+CELL/2+bob);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // ── Snake ──────────────────────────────────────────────────
  const st = getDrawStyle();
  const hRGB = hexRGB(st.hc), tRGB = hexRGB(st.tc);
  const shOn  = !!effects.shield;
  const bigOn = selChar==='ironboa' && (ironPassive || ultActive);

  ctx.globalAlpha = st.alpha;

  for(let i=snake.length-1; i>=0; i--){
    const seg=snake[i], isHead=(i===0);
    const ratio = 1-i/snake.length;

    // Color interpolation tail → head
    const r=Math.round(lerp(tRGB[0],hRGB[0],ratio));
    const g=Math.round(lerp(tRGB[1],hRGB[1],ratio));
    const b=Math.round(lerp(tRGB[2],hRGB[2],ratio));
    const col=`rgb(${r},${g},${b})`;

    // Scaled size
    const sz   = CELL * st.scale;
    const off  = (sz - CELL) / 2;
    const pad  = isHead ? 0 : 1;
    const rx   = seg.x*CELL - off + pad;
    const ry   = seg.y*CELL - off + pad;
    const rw   = sz - pad*2;
    const rh   = sz - pad*2;
    const rr   = Math.min(isHead ? 9 : 5, rw/2, rh/2);

    // Glow
    if (shOn)           { ctx.shadowColor='#00eaff'; ctx.shadowBlur=isHead?22:12; }
    else if (bigOn)     { ctx.shadowColor='#4fc3f7'; ctx.shadowBlur=isHead?28:16; }
    else if (ultActive) { ctx.shadowColor=st.gc;     ctx.shadowBlur=isHead?24:13; }
    else                { ctx.shadowColor=col;        ctx.shadowBlur=isHead?14:6;  }

    ctx.fillStyle=col;
    rrect(rx, ry, rw, rh, rr);
    ctx.fill();

    if (isHead) drawEyes(seg, dir, st.scale);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}

function drawEyes(seg, d, scale) {
  ctx.shadowBlur=0;
  const sz  = CELL*scale;
  const off = (sz-CELL)/2;
  const ox  = seg.x*CELL - off;
  const oy  = seg.y*CELL - off;

  let e1x,e1y,e2x,e2y;
  if      (d.x===1)  { e1x=ox+sz*.75; e1y=oy+sz*.25; e2x=ox+sz*.75; e2y=oy+sz*.65; }
  else if (d.x===-1) { e1x=ox+sz*.25; e1y=oy+sz*.25; e2x=ox+sz*.25; e2y=oy+sz*.65; }
  else if (d.y===-1) { e1x=ox+sz*.28; e1y=oy+sz*.28; e2x=ox+sz*.65; e2y=oy+sz*.28; }
  else               { e1x=ox+sz*.28; e1y=oy+sz*.72; e2x=ox+sz*.65; e2y=oy+sz*.72; }

  const er=Math.max(1.8, sz*0.095);
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(e1x,e1y,er,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(e2x,e2y,er,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(e1x+er*.25,e1y+er*.25,er*.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(e2x+er*.25,e2y+er*.25,er*.5,0,Math.PI*2); ctx.fill();
}

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
const lerp = (a,b,t)=>a+(b-a)*t;
function hexRGB(hex){
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function rrect(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function spawnPfx(gx,gy,col,n){
  const cx=gx*CELL+CELL/2, cy=gy*CELL+CELL/2;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,
      r:2+Math.random()*2,col,life:20+Math.random()*20,maxL:40});
  }
}

// ═══════════════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════════════
const _pv={};
function animStat(id,v){
  const el=document.getElementById(id);
  el.textContent=v;
  if(_pv[id]!==v){
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    setTimeout(()=>el.classList.remove('bump'),150); _pv[id]=v;
  }
}
function updateHUD(){
  animStat('scoreDisp',score); animStat('bestDisp',best);
  document.getElementById('lvlDisp').textContent=level;
  document.getElementById('comboDisp').textContent=`×${combo}`;
  document.getElementById('lenDisp').textContent=snake?snake.length:0;
  document.getElementById('lvNum').textContent=level;
  const need=xpNeed(level);
  document.getElementById('xpTxt').textContent=`${xp}/${need} XP`;
  document.getElementById('lvFill').style.width=`${Math.min(xp/need*100,100)}%`;
}

function updateUltUI(){
  const c=CHARS[selChar];
  const pct=Math.min(ultGauge/c.ultCost*100,100);
  document.getElementById('ultFill').style.width=pct+'%';
  const full=ultGauge>=c.ultCost&&!ultActive;
  document.getElementById('ultKey').classList.toggle('ready',full);
  document.getElementById('ultFill').classList.toggle('ready',full);
  if(ultActive&&c.ultDur>0){
    const rem=Math.max(0,(ultUntil-Date.now())/1000);
    document.getElementById('ultTxt').textContent=rem.toFixed(1)+'s';
    document.getElementById('ultTxt').style.color=c.hc;
  } else {
    document.getElementById('ultTxt').textContent=`${ultGauge}/${c.ultCost}`;
    document.getElementById('ultTxt').style.color=full?c.hc:'';
  }
}

function updateEffUI(){
  const list=document.getElementById('effList');
  const rows=[];
  const efCols={speed:'#ffe600',shield:'#00eaff',double:'#bf00ff'};
  const efEm  ={speed:'⚡',shield:'🛡️',double:'✨'};
  for(const[k,v]of Object.entries(effects)){
    if(v.until){
      const pct=Math.max(0,(v.until-Date.now())/(ITEMS[k]?.duration||1)*100).toFixed(1);
      rows.push(`<div class="eff-item">
        <span class="eff-icon">${efEm[k]||'✦'}</span>
        <div class="eff-bar-bg">
          <div class="eff-bar" style="width:${pct}%;background:${efCols[k]||'#fff'};box-shadow:0 0 5px ${efCols[k]||'#fff'}"></div>
        </div></div>`);
    }
  }
  // Iron Boa passive
  if(selChar==='ironboa'){
    const pct=ironPassive?100:(ironCount/10*100);
    const lbl=ironPassive?'🛡️ 거대화 중!':`🍎 ${ironCount}/10`;
    const col=ironPassive?'#4fc3f7':'#7986cb';
    rows.push(`<div style="margin-bottom:2px">
      <div class="pm-label"><span style="color:${col}">${lbl}</span></div>
      <div class="pm-bg"><div class="pm-fill" style="width:${pct}%;background:linear-gradient(90deg,${col},#29b6f6);box-shadow:0 0 5px ${col}"></div></div>
    </div>`);
  }
  // Basilisk next auto
  if(selChar==='basilisk'&&running){
    const rem=Math.max(0,((basiliskNextAuto-Date.now())/10000*100)).toFixed(1);
    rows.push(`<div style="margin-bottom:2px">
      <div class="pm-label"><span style="color:#e91e8c">💜 오토콤보 ${(Math.max(0,basiliskNextAuto-Date.now())/1000).toFixed(1)}s</span></div>
      <div class="pm-bg"><div class="pm-fill" style="width:${100-parseFloat(rem)}%;background:linear-gradient(90deg,#e91e8c,#9c27b0);box-shadow:0 0 5px #e91e8c"></div></div>
    </div>`);
  }
  // Ult active
  if(ultActive){
    const c=CHARS[selChar];
    rows.push(`<div class="eff-item">
      <span class="eff-icon">${c.emoji}</span>
      <span style="font-size:.72rem;color:${c.hc};font-weight:700;letter-spacing:1px">궁극기 발동!</span>
    </div>`);
  }
  list.innerHTML=rows.length?rows.join(''):'<div class="eff-empty">효과 없음</div>';
}

function showCombo(cell){
  if(combo<=1)return;
  const el=document.createElement('div'); el.className='combo-pop';
  el.textContent=`×${combo} COMBO!`;
  const r=canvas.getBoundingClientRect();
  el.style.left=(r.left+cell.x*CELL)+'px'; el.style.top=(r.top+cell.y*CELL)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1000);
}
function showFloatPt(pts,cell,col='#39ff14'){
  const el=document.createElement('div'); el.className='float-score';
  el.textContent=`+${pts}`; el.style.color=col;
  const r=canvas.getBoundingClientRect();
  el.style.left=(r.left+cell.x*CELL+CELL/2)+'px'; el.style.top=(r.top+cell.y*CELL)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),950);
}
function announce(txt,col){
  const el=document.createElement('div'); el.className='ult-announce';
  el.textContent=txt; el.style.color=col; el.style.textShadow=`0 0 28px ${col}`;
  document.body.appendChild(el); setTimeout(()=>el.remove(),1500);
}

// ═══════════════════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════════════════
let AC;
const getAC=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function playBeep(type){
  try{
    const ac=getAC(), o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    ({apple:440,speed:880,shield:660,double:550,diamond:1100,bomb:110})[type]
      ? (o.frequency.value=({apple:440,speed:880,shield:660,double:550,diamond:1100,bomb:110})[type]) : 0;
    o.type=type==='bomb'?'sawtooth':'sine';
    g.gain.setValueAtTime(.1,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);
    o.start(ac.currentTime); o.stop(ac.currentTime+.25);
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════════
const DMAP={
  ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
  w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},
  W:{x:0,y:-1},S:{x:0,y:1},A:{x:-1,y:0},D:{x:1,y:0},
};
document.addEventListener('keydown',e=>{
  if(DMAP[e.key]){
    e.preventDefault();
    const nd=DMAP[e.key];
    if(nd.x!==-dir.x||nd.y!==-dir.y) nextDir=nd;
  }
  if((e.key==='q'||e.key==='Q')&&running&&!paused) activateUlt();
  if((e.key==='p'||e.key==='P')) togglePause();
  if((e.key==='r'||e.key==='R')&&running) startGame();
});
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});

function dpad(d){
  const m={UP:{x:0,y:-1},DOWN:{x:0,y:1},LEFT:{x:-1,y:0},RIGHT:{x:1,y:0}};
  const nd=m[d]; if(nd.x!==-dir.x||nd.y!==-dir.y) nextDir=nd;
}
function togglePause(){
  if(!running)return; paused=!paused; if(!paused)loop();
}
let ts=null;
canvas.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(!ts)return;
  const dx=e.changedTouches[0].clientX-ts.x, dy=e.changedTouches[0].clientY-ts.y;
  if(Math.abs(dx)>Math.abs(dy)) dpad(dx>0?'RIGHT':'LEFT');
  else dpad(dy>0?'DOWN':'UP');
  ts=null;
},{passive:false});

setInterval(()=>{ if(running&&!paused){updateUltUI();updateEffUI();} },80);
updateHUD();
</script>
